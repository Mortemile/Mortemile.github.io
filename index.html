<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Picker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #248bcf);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        h2 { margin-bottom: 5px; font-size: 20px; text-align: center; }
        p { color: var(--hint-color); font-size: 14px; margin-bottom: 20px; text-align: center; }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .hour-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 15px 0;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .hour-card.active {
            border-color: var(--button-color);
            background-color: var(--button-color);
            color: var(--button-text);
        }

        .footer-info {
            margin-top: 30px;
            font-size: 12px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <h2 id="title"></h2>
    <p id="description"></p>

    <div class="time-grid" id="timeGrid"></div>

    <div class="footer-info" id="tzInfo"></div>

    <script>
        const tg = window.Telegram.WebApp;
        const userLang = (tg.initDataUnsafe?.user?.language_code || 'en').toLowerCase();
        
        // Словарик переводов
        const i18n = {
            ru: {
                title: "Выберите время",
                desc: "В какой час присылать карту дня?<br>(по вашему местному времени)",
                tz: "Ваш пояс",
                btn: "ПОЛУЧАТЬ В"
            },
            en: {
                title: "Select Time",
                desc: "At what hour should I send the card?<br>(your local time)",
                tz: "Your timezone",
                btn: "RECEIVE AT"
            }
        };

        // Определяем язык (если не русский, то английский)
        const lang = (userLang && userLang.startsWith('ru')) ? 'ru' : 'en';
        const texts = i18n[lang];

        // Устанавливаем тексты на страницу
        document.getElementById('title').innerText = texts.title;
        document.getElementById('description').innerHTML = texts.desc;

        const grid = document.getElementById('timeGrid');
        const tzInfo = document.getElementById('tzInfo');
        let selectedHour = null;

        tg.expand();

        // Часовой пояс
        const offsetMin = new Date().getTimezoneOffset();
        const offsetHours = -offsetMin / 60;
        tzInfo.innerText = `${texts.tz}: GMT${offsetHours >= 0 ? '+' : ''}${offsetHours}`;

        // Сетка часов
        for (let i = 0; i < 24; i++) {
            const hour = i < 10 ? '0' + i : i;
            const card = document.createElement('div');
            card.className = 'hour-card';
            card.innerText = `${hour}:00`;
            card.onclick = () => selectHour(i, card);
            grid.appendChild(card);
        }

        function selectHour(hour, element) {
            document.querySelectorAll('.hour-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedHour = hour;

            tg.MainButton.text = `${texts.btn} ${hour}:00`;
            tg.MainButton.show();
        }

        tg.onEvent('mainButtonClicked', function() {
            // Расчет МСК времени
            let utcHour = selectedHour + (offsetMin / 60);
            let mskHour = Math.floor(utcHour + 3);
            mskHour = (mskHour % 24 + 24) % 24;

            const data = {
                local_hour: selectedHour,
                msk_hour: mskHour,
                lang: lang // Отправляем язык боту, чтобы он ответил на нужной языке
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
