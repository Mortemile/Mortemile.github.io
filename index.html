<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор времени</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #248bcf);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        h2 { margin-bottom: 5px; font-size: 20px; }
        p { color: var(--hint-color); font-size: 14px; margin-bottom: 20px; text-align: center; }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .hour-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 15px 0;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .hour-card.active {
            border-color: var(--button-color);
            background-color: var(--button-color);
            color: var(--button-text);
        }

        .footer-info {
            margin-top: 30px;
            font-size: 12px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <h2>Выберите время</h2>
    <p>В какой час присылать карту дня?<br>(по вашему местному времени)</p>

    <div class="time-grid" id="timeGrid">
        <!-- Кнопки от 00 до 23 сгенерируются тут -->
    </div>

    <div class="footer-info" id="tzInfo"></div>

    <script>
    const tg = window.Telegram.WebApp;
    const grid = document.getElementById('timeGrid');
    let selectedHour = null;

    tg.expand();

    for (let i = 0; i < 24; i++) {
        const hour = i < 10 ? '0' + i : i;
        const card = document.createElement('div');
        card.className = 'hour-card';
        card.innerText = `${hour}:00`;
        card.onclick = () => selectHour(i, card);
        grid.appendChild(card);
    }

    function selectHour(hour, element) {
        document.querySelectorAll('.hour-card').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
        selectedHour = hour;

        tg.MainButton.text = `ПОЛУЧАТЬ В ${hour}:00`;
        tg.MainButton.show();
    }

    tg.onEvent('mainButtonClicked', function() {
        // 1. Получаем смещение пользователя в минутах (например, для Берлина это -60, для МСК -180)
        const offsetMin = new Date().getTimezoneOffset(); 
        
        // 2. Вычисляем время в UTC (выбранный час + смещение/60)
        let utcHour = selectedHour + (offsetMin / 60);
        
        // 3. Переводим UTC в МСК (UTC + 3)
        let mskHour = Math.floor(utcHour + 3);
        
        // Корректируем, если вышли за пределы 0-23 (например, если в МСК уже следующий день)
        mskHour = (mskHour % 24 + 24) % 24;

        const data = {
            local_hour: selectedHour,
            msk_hour: mskHour
        };

        tg.sendData(JSON.stringify(data));
    });
</script>
</body>
</html>
